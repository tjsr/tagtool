version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.GITHUB_TOKEN}}
updates:
  - package-ecosystem: 'npm'
    rebase-strategy: auto
    directory: '/'
    registries:
    - npm-github
    schedule:
      interval: 'daily'
    assignees:
    - 'tjsr'
    groups:
      linter:
        applies-to: version-updates
        patterns:
          - "@tjsr/eslint-config"
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "@stylistic/*"
  - package-ecosystem: "github-actions"
    rebase-strategy: auto
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    assignees:
    - 'tjsr'
