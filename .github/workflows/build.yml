name: Build Tagtool
on:
  push:
  pull_request:
permissions:
  contents: read
  packages: read

jobs:
  worker:
    name: Verify Worker and local D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tjsr'
          cache: npm
      - run: npm ci --allow-git=root
      - run: npm test
      - run: npm run build
      - run: npm run check:worker

  migration-rehearsal:
    name: Rehearse one-time MySQL to D1 import
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: testdb
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-only-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=10s
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    steps:
      - uses: actions/checkout@v7
      - name: Prepare isolated legacy fixture
        env:
          CI_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          printf 'MYSQL_PORT=%s\n' "$MYSQL_PORT" >> "$GITHUB_ENV"
          bash .github/scripts/prepare-test-database.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tjsr'
          cache: npm
      - run: npm ci --allow-git=root
      - name: Export and import fixture
        run: |
          node scripts/export-mysql-for-d1.mjs "$RUNNER_TEMP/tagtool-test.d1-export.sql"
          npx wrangler d1 migrations apply tagtool-local --local
          npx wrangler d1 execute tagtool-local --local --file "$RUNNER_TEMP/tagtool-test.d1-export.sql"
